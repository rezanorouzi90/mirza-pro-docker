version: '3.8'

services:
  mirza-pro:
    build: .
    container_name: mirza-pro
    restart: unless-stopped
    
    environment:
      # ── اجباری ──
      BOT_TOKEN: "${BOT_TOKEN}"
      ADMIN_ID: "${ADMIN_ID}"
      BOT_USERNAME: "${BOT_USERNAME}"
      
      # ── اختیاری ──
      DOMAIN: "${DOMAIN:-}"
      DB_NAME: "${DB_NAME:-mirza_pro}"
      DB_USER: "${DB_USER:-mirza_user}"
      DB_PASS: "${DB_PASS:-}"
    
    ports:
      - "${PORT:-8080}:80"
    
    volumes:
      - mysql_data:/var/lib/mysql
      - mirza_files:/var/www/mirza_pro

volumes:
  mysql_data:
    driver: local
  mirza_files:
    driver: local
